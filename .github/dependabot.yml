version: 2

updates:
  - package-ecosystem: pnpm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '04:17'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      electron-build-minor-patch:
        patterns:
          - electron
          - electron-builder
          - electron-vite
          - vite
          - '@vitejs/*'
        update-types:
          - minor
          - patch
      security-validation-minor-patch:
        patterns:
          - zod
        update-types:
          - minor
          - patch
      test-tooling-minor-patch:
        patterns:
          - '@playwright/test'
          - '@testing-library/*'
          - '@vitest/*'
          - vitest
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '04:17'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
